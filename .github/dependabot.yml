version: 2
updates:
  # Python dependencies managed by uv (watches pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Bundle minor/patch bumps into one PR to reduce noise;
      # major versions still get individual PRs for careful review.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"