services:
  crewai-factory:
    build: .
    container_name: crewai-factory
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./personas:/app/personas:ro
      - ./output:/app/output
