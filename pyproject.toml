[project]
name = "crewai-factory"
version = "0.2.0"
description = "A configurable multi-agent content generation framework powered by CrewAI and Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "StanS" }]
keywords = ["crewai", "multi-agent", "llm", "content-generation", "ollama"]

dependencies = [
    "crewai>=1.15.2",
    "loguru>=0.7",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
run-factory = "crewai_factory.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_factory"]